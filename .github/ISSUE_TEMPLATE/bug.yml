name: Bug
description: Algo no funciona como el contrato o la UI prometen
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: track
    attributes:
      label: Track / producto
      options:
        - GovSecurity — Cuadra
        - GovRisk
        - GovTransparency
        - GovHealth
        - Plataforma / DX
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Cómo reproducir
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      options:
        - bloqueante
        - alta
        - media
        - baja
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: No incluye secretos, datos personales reales ni coordenadas exactas en este issue
          required: true
